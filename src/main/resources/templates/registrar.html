<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartPark - Registro de ingreso</title>
    <link rel="stylesheet" th:href="@{/css/smartpark.css}" />
</head>
<body>
<nav class="main-navbar">
    <div class="brand" aria-label="SmartPark logo">
        <span class="brand-mark">P</span>
        <span class="brand-text">Smart<span>Park</span></span>
    </div>
    <div class="nav-items">
        <a class="nav-item" th:href="@{/dashboard}">Inicio</a>
        <a class="nav-item active" th:href="@{/registrar}">Registrar</a>
        <a class="nav-item" th:href="@{/modulo}">Módulo</a>
        <a class="nav-item" th:href="@{/historial}">Historial</a>
        <a class="nav-item" th:if="${session.rol == 'ADMIN'}" th:href="@{/datos}">Datos</a>
        <a class="nav-item logout" th:href="@{/logout}">Salir</a>
    </div>
</nav>

<main class="page-shell narrow-shell">
    <div class="section-header compact-header">
        <h1>Registro de ingreso</h1>
        <p>Registra el ingreso de un vehículo al estacionamiento.</p>
    </div>

    <section class="panel form-panel">
        <div class="panel-title-row">
            <div class="mini-icon">
                <svg viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"></path><rect x="9" y="11" width="14" height="10" rx="2"></rect><circle cx="12" cy="16" r="1"></circle></svg>
            </div>
            <h2>Datos del vehículo</h2>
        </div>

        <form th:action="@{/registrar}" method="post" class="smartpark-form">
            <div class="field-group">
                <label>Nombre del cliente</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <input type="text" name="cliente" placeholder="Ej: Carlos Mendoza" />
                </div>
            </div>

            <div class="field-group">
                <label>Placa del vehículo</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"></rect><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><circle cx="8" cy="12" r="1"></circle><circle cx="16" cy="12" r="1"></circle></svg>
                    </span>
                    <input type="text" name="placa" placeholder="Ej: ABC-123" />
                </div>
            </div>

            <div th:if="${error != null}" class="message error">[[${error}]]</div>
            <div th:if="${success != null}" class="message success">[[${success}]]</div>

            <button type="submit" class="button primary">Agregar</button>
        </form>
    </section>
</main>

<footer class="main-footer">© 2026 SmartPark. Todos los derechos reservados.</footer>
<script th:src="@{/js/smartpark.js}"></script>
</body>
</html>
