<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartPark - Crear cuenta</title>
    <link rel="stylesheet" th:href="@{/css/smartpark.css}" />
</head>

<body class="auth-page">
    <div class="topbar-simple">
        <div class="brand" aria-label="SmartPark logo">
            <span class="brand-mark">P</span>
            <span class="brand-text">Smart<span>Park</span></span>
        </div>
    </div>

    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-header">
                <div class="brand brand-large">
                    <span class="brand-mark">P</span>
                    <span class="brand-text">Smart<span>Park</span></span>
                </div>
                <h1>Crear cuenta</h1>
                <p>Completa tus datos para registrarte</p>
            </div>

            
            <form th:action="@{/register}" method="post" class="smartpark-form">
                <div class="split-cols">
                    <div class="field-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" required minlength="2" maxlength="40"
                            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras, entre 2 y 40 caracteres"
                            placeholder="Juan" />
                    </div>
                    <div class="field-group">
                        <label>Apellido</label>
                        <input type="text" name="apellido" required minlength="2" maxlength="40"
                            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+" title="Solo letras, entre 2 y 40 caracteres"
                            placeholder="Pérez" />
                    </div>
                </div>

                <div class="field-group">
                    <label>Correo electrónico</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                <path d="m22 7-10 7L2 7"></path>
                            </svg>
                        </span>
                        <input type="email" name="email" required maxlength="80" placeholder="ejemplo@correo.com" />
                    </div>
                </div>

                <div class="field-group">
                    <label>Contraseña</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" name="password" class="has-toggle" required minlength="8" maxlength="30"
                            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S{8,30}"
                            title="De 8 a 30 caracteres, con al menos 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial, sin espacios" />
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg class="eye-open" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <small style="color:#6b7280;font-size:12px;">
                        Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.
                    </small>
                </div>

                <div th:if="${error != null}" class="message error">[[${error}]]</div>
                <button type="submit" class="button primary full-width">Completar registro</button>
            </form>

            <div class="auth-link-row">
                ¿Ya tienes una cuenta? <a th:href="@{/login}">Iniciar sesión</a>
            </div>
        </section>
    </main>

    <script th:src="@{/js/smartpark.js}"></script>
</body>

</html>
